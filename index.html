<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The workshop light is the only theme Tessera has, so browser surfaces should not guess a dark one. -->
    <meta name="color-scheme" content="light" />
    <!-- --bar: the browser chrome continues the espresso bar instead of sitting off it. -->
    <meta name="theme-color" content="#2E241B" />

    <title>Tessera · 3D-printable relief tiles</title>
    <meta
      name="description"
      content="Design 3D-printed relief tiles that fit your wall exactly: enter the wall and tile size, pick a relief and a color, and download print-ready STL or STEP files."
    />

    <!--
      Absolute on the site's own domain: Facebook, LinkedIn and Slack refuse a relative og:image, and
      scrapers do not run the script below that rewrites og:url for the page actually opened. A
      canonical cannot be written statically here: /studio, /download and /history serve this same file.
    -->
    <meta property="og:url" content="https://tessera.stephenperrin.fr/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tessera" />
    <meta property="og:title" content="Tessera · 3D-printable relief tiles" />
    <meta
      property="og:description"
      content="Design 3D-printed tiles that fit your wall exactly. Enter the wall and tile size, pick a relief and a color, and download print-ready STL or STEP files: one per unique piece, edge cuts included, with the pattern running on across every joint."
    />
    <meta property="og:image" content="https://tessera.stephenperrin.fr/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Tessera's landing page: the headline &quot;Design 3D-printed tiles that fit your wall exactly&quot; and the wall size fields, beside a wall of green wavy relief tiles with its edge pieces cut to fit."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Archivo is the whole typographic voice, so it is preloaded rather than discovered after the CSS
      parses (90 kB, over 1.1 s on Slow 4G). The face is declared here against a stable public/ path
      because the bundled copy's URL is content-hashed and cannot be preloaded from static HTML.
      Latin only: the UI is English, and its glyphs (× · ° ² ’ ↑ ↓ −) all sit in this range.
    -->
    <link rel="preload" href="/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      // Self-referencing canonical, written from the address actually served. Guessing a domain would
      // be worse than having none: it would hand crawlers someone else's canonical. Dropping the query
      // string is the real work here, so /studio?utm_source=... does not read as a second page.
      ;(function () {
        var page = location.origin + location.pathname
        var link = document.createElement('link')
        link.rel = 'canonical'
        link.href = page
        document.head.appendChild(link)
        document.querySelector('meta[property="og:url"]').setAttribute('content', page)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Tessera needs JavaScript to draw and render your tiles.</noscript>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Deliberately after the bundle's stylesheet, which Vite injects at the end of <head>: when two
      faces match identically the last one declared wins, so in <head> this would lose to the
      fontsource copy and the preload above would fetch 90 kB nobody uses. Measured: one woff2 request
      per load from here, two from <head>. Once src/styles/main.scss drops its
      `@use '@fontsource-variable/archivo/wdth.css'`, this block belongs back in <head> with the preload.
    -->
    <style>
      @font-face {
        font-family: 'Archivo Variable';
        font-style: normal;
        font-display: swap;
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url('/fonts/archivo-latin-wdth-normal.woff2') format('woff2-variations');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329,
          U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
    </style>
  </body>
</html>
